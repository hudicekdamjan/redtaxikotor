# Render Blueprint — static site
services:
  - type: web
    name: red-taxi
    runtime: static
    buildCommand: npm ci && (npx playwright install chromium || true) && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
